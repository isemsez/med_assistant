# Разговорные названия и пробелы реестра ГРЛС для МНН-grounding
# (architecture.md §3[1]). Курируемая владельцем истина — файл НЕ
# расширяется автоматически.
#
# Значение: торговое наименование из реестра (разрешается через словарь
# drugmap — см. data/drugs.sqlite) ИЛИ непосредственно МНН, когда строки
# реестра не несут МНН (заполнитель ~) или вещества в реестре нет вовсе.
#
# Примеры:
#   валерьянка: Валерианы настойка            # имя из реестра
#   кагоцел: меглюмина акридонацетат          # прямое МНН (в реестре ~)
валерьянка: Валерианы настойка
кагоцел: меглюмина акридонацетат
