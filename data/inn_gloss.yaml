# Английские соответствия для компонентов МНН реестра ГРЛС, которые НЕ
# конвертируются из списка ВОЗ (data/inn_list_en-lat.txt): истинные
# пробелы ВОЗ — фармакопейные соли и вещества без INN (architecture.md
# §3[1]). Курируемая владельцем истина; подмешивается ПРИ СБОРКЕ
# (scripts/inn_to_en.py пишет колонку inn_pair в data/drugs.sqlite —
# после правки этого файла запустите скрипт снова).
#
# Ключ = нормализованный компонент МНН (как после чистки drugmap),
# значение = английская форма.
левоментола раствор в ментилизовалерате: levomenthol in menthyl isovalerate
левоментола раствор в ментил изовалерате: levomenthol in menthyl isovalerate
# фармакопейные соли железа (нет в списке INN ВОЗ)
железа сульфат: ferrous sulfate
железа фумарат: ferrous fumarate
железа глюконат: ferrous gluconate
# ментол/тимол: в списке ВОЗ есть только стереоспецифичные INN
ментол: menthol
тимол: thymol
# салицилаты: отсутствуют в списке ВОЗ
салициловая кислота: salicylic acid
ацетилсалициловая кислота: acetylsalicylic acid
