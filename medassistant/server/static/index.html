<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мед.ассистент</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-head">
      <span class="logo">Мед.ассистент</span>
    </div>
    <button id="new-session" class="btn-primary">Новая беседа</button>
    <div id="sessions"></div>
    <div class="sidebar-foot">
      <span id="backend-status">●</span>
      <span>Medgemma обучена на системе здравоохранения США — российские официальные рекомендации под ответами.</span>
    </div>
  </aside>
  <main id="chat">
    <div id="messages"></div>
    <div id="composer-area">
      <div id="card-bar" hidden>
        <span class="chip">Карта: <span class="chip-name"></span><button type="button" id="card-clear" title="Убрать карту">×</button></span>
      </div>
      <div id="card-menu" hidden></div>
      <form id="composer">
        <button type="button" id="card-btn" class="btn-card" title="Приложить выписку из амбулаторной карты">Карта пациента</button>
        <textarea id="question" rows="2" placeholder="Вопрос врача…" autofocus></textarea>
        <button type="submit" id="send" class="btn-primary">Отправить</button>
        <label id="card-attach" class="card-attach" hidden title="Приложить карту к этому вопросу"><input type="checkbox" id="card-use" checked> С картой</label>
      </form>
    </div>
  </main>
</div>
<script src="/util.js"></script>
<script src="/app.js"></script>
</body>
</html>
